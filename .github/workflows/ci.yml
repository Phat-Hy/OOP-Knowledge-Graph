name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run static type checks
      run: npx tsc --noEmit

    - name: Run ESLint
      run: npx eslint oop-kg/backend/server.js oop-kg/frontend/app.js api/index.js

    - name: Run API test suite
      run: npm test

    - name: Run extractor test
      run: npm run test:extract
